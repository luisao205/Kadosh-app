name: Kadosh validation

on:
  push:
    branches:
      - fix/windows-updater-single-instance
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  web-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/test-versioning.mjs
      - run: node scripts/test-song-structure.mjs
      - run: node scripts/test-electron-updater.mjs
      - run: node scripts/test-electron-wrapper.mjs
      - run: node scripts/test-android-updater.mjs
      - run: node scripts/test-preaching-permissions.mjs
      - run: node --check functions/main.js
      - name: Lint new update and PDF implementation files
        run: >-
          npx eslint
          src/components/admin/UpdateCenter.jsx
          src/components/updates/AndroidUpdateGate.jsx
          src/components/updates/GlobalUpdateCenter.jsx
          src/components/songs/SongExportCenter.jsx
          src/native/kadoshUpdate.js
          src/utils/versioning.js
          src/utils/appUpdates.js
          src/utils/songPrint.js
          src/utils/songParser.js
          functions/main.js
      - run: npm run build
      - run: npm run build:android
      - name: Verify Android bundle has no PWA service worker
        run: test ! -f dist/sw.js && test ! -f dist/registerSW.js
      - name: Report repository-wide lint baseline
        continue-on-error: true
        run: npm run lint

  windows-desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: Verify NSIS updater artifacts
        shell: pwsh
        run: |
          if (!(Test-Path 'release/Kadosh-App-Setup-1.1.8.exe')) { throw 'Missing NSIS setup' }
          if (!(Test-Path 'release/Kadosh-App-Setup-1.1.8.exe.blockmap')) { throw 'Missing NSIS blockmap' }
          if (!(Test-Path 'release/latest.yml')) { throw 'Missing latest.yml' }
          Get-ChildItem release

  android-native-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:sync
      - name: Compile Android updater integration
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
